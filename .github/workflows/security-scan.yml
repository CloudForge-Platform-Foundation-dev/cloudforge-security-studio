# Required by Foundation policy (policies/security/security-policies.rego)
name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: table
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"
